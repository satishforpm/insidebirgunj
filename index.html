.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:rgba(255,255,255,.12)}
.scene i{position:absolute;font-style:normal;font-size:2.4rem;opacity:.35;bottom:-60px;animation:rise 16s linear infinite}
.scene i:nth-child(1){left:6%}.scene i:nth-child(2){left:20%;animation-delay:3s}.scene i:nth-child(3){left:34%;animation-delay:7s}.scene i:nth-child(4){left:48%;animation-delay:1s}
.scene i:nth-child(5){left:62%;animation-delay:5s}.scene i:nth-child(6){left:76%;animation-delay:9s}.scene i:nth-child(7){left:88%;animation-delay:2s}.scene i:nth-child(8){left:12%;animation-delay:11s}
@keyframes rise{to{transform:translateY(-115vh) rotate(20deg)}}
@keyframes flow{50%{background-position:100% 100%}}
#splash{position:fixed;inset:0;z-index:99;background:#fff;display:grid;place-content:center;justify-items:center;gap:12px;transition:opacity .5s}
#splash img{width:130px;border-radius:50%;animation:pop .8s ease}#splash p{font-weight:700;color:var(--navy);letter-spacing:.06em}
#splash.off{opacity:0;pointer-events:none}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.spin{width:26px;height:26px;border:3px solid var(--sky2);border-top-color:var(--royal);border-radius:50%;animation:sp 1s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
#app{max-width:980px;margin:0 auto;padding:16px;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:18px;box-shadow:0 8px 28px rgba(15,42,107,.12)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px}
.top img{width:46px;height:46px;border-radius:50%}.top b{color:var(--navy);letter-spacing:.04em}.top small{display:block;color:var(--mut)}
.top .sp{flex:1}
.hero{padding:22px;margin-bottom:16px;display:grid;gap:8px}.hero h1{font-size:1.7rem}
.hero .tag{color:#8a1c3a;font-weight:600}
h2.sec{font-size:1.15rem;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{font:600 .85rem system-ui;color:var(--royal);cursor:pointer}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick a{padding:12px 4px;text-align:center;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--navy);transition:transform .2s}
.quick a:active{transform:scale(.95)}.quick span{display:block;font-size:1.6rem}
.card{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card .th{aspect-ratio:16/9;background:linear-gradient(135deg,var(--sky2),var(--royal));display:grid;place-items:center;font-size:2rem;color:#fff;overflow:hidden}
.card .th img,.card .th video{width:100%;height:100%;object-fit:cover}
.card .bd{padding:12px 14px;display:grid;gap:4px}.card h3{font-size:1rem}
.card p{color:var(--mut);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.78rem;color:var(--mut)}
.badge{display:inline-block;background:var(--sky);color:var(--royal);border-radius:99px;padding:1px 10px;font-size:.75rem;font-weight:600;width:max-content}
.badge.draft{background:#fef3c7;color:#92400e}.badge.emergency{background:#fee2e2;color:var(--err)}
.btn{border:0;border-radius:12px;padding:10px 18px;font:600 .95rem inherit;font-family:inherit;background:var(--royal);color:#fff;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{background:var(--navy)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--sky);color:var(--royal)}.btn.red{background:var(--err)}.btn.sm{padding:5px 12px;font-size:.82rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
label{display:grid;gap:4px;font-weight:600;font-size:.88rem;color:var(--navy)}
form{display:grid;gap:12px}.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.pad{padding:18px}
.prev{display:flex;gap:8px;flex-wrap:wrap}.prev img,.prev video{width:96px;height:96px;object-fit:cover;border-radius:10px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty b{display:block;font-size:2.2rem}
.post img.big,.post video{width:100%;border-radius:14px;margin:8px 0;max-height:80vh;object-fit:contain;background:#0b1b44}
.post .txt{white-space:pre-line;font-size:1.05rem}
.gal{columns:2 150px;gap:8px}.gal img{width:100%;border-radius:12px;margin-bottom:8px;cursor:zoom-in;display:block}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.chips button{white-space:nowrap}
.chips .on{background:var(--royal);color:#fff}
.list{display:grid;gap:8px}.item{display:flex;gap:12px;align-items:center;padding:10px 12px}.item .grow{flex:1;min-width:0}
.item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:none}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--sky2);display:grid;place-items:center;font-weight:700;color:var(--navy);flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats div{padding:14px}.stats b{font-size:1.8rem;color:var(--royal);display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem;padding:10px}.cal span{padding:6px 0;border-radius:8px}.cal .ev{background:var(--royal);color:#fff;font-weight:700}.cal .hd{color:var(--mut)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
#tabs a{flex:1;text-align:center;font-size:.7rem;font-weight:600;color:var(--mut);padding:4px;cursor:pointer;position:relative}#tabs a span{display:block;font-size:1.35rem}
#tabs a.on{color:var(--royal)}#tabs .n{position:absolute;top:0;right:22%;background:var(--err);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px}
#side{display:none}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,380px)}
.toast{padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;background:var(--ok);animation:pop .3s}.toast.err{background:var(--err)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,15,50,.88);display:grid;place-items:center;padding:12px}
#modal[hidden]{display:none}#modal img{max-width:100%;max-height:92vh;border-radius:8px}#modal .x{position:absolute;top:12px;right:16px}
.tbl{display:flex;gap:4px;flex-wrap:wrap}
@media(min-width:99999px){
 body{padding:0 0 0 250px}#tabs{display:none}
 #side{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:250px;padding:18px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-right:1px solid var(--line);overflow:auto;z-index:20}
 #side .lg{display:grid;justify-items:center;gap:6px;text-align:center;margin-bottom:10px;font-weight:700;color:var(--navy)}#side .lg img{width:110px;border-radius:50%}
 #side a{padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--navy);display:flex;gap:10px;justify-content:space-between}
 #side a:hover{background:var(--sky)}#side a.on{background:var(--royal);color:#fff}
 .hide-d{display:none}
}
@media(max-width:560px){.two{grid-template-columns:1fr}.hero h1{font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bg video{display:none}.bg video[src]{display:block}
.anim{position:absolute;left:0;bottom:0;width:100%;max-height:70vh}
.cl{opacity:.9}.c1{animation:drift 70s linear infinite}.c2{animation:drift 95s linear infinite -40s}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(860px)}}
.rays{animation:spin 24s linear infinite;transform-origin:0 0}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 6s ease-in-out infinite}
@keyframes rise{0%,12%{transform:translateY(12px) scaleY(.72)}45%,100%{transform:none}}
.arm{animation:arm 6s ease-in-out infinite}@keyframes arm{0%,12%{transform:translateY(8px)}45%,100%{transform:none}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%{transform:scale(.25)}70%,100%{transform:scale(1)}}
.drop{animation:drop 1.4s ease-in infinite}.d2{animation-delay:.4s}.d3{animation-delay:.8s}
@keyframes drop{from{transform:translateY(-4px);opacity:1}to{transform:translateY(26px);opacity:0}}
.can{transform-box:fill-box;transform-origin:0 100%;animation:tilt 3s ease-in-out infinite}@keyframes tilt{50%{transform:rotate(12deg)}}
.bowl{animation:bowl 5s ease-in-out infinite}@keyframes bowl{0%,15%{transform:translateX(-6px)}55%,100%{transform:translateX(26px)}}
.heart{opacity:0;animation:hrt 6s ease-in infinite}.h2{animation-delay:2.5s}
@keyframes hrt{0%,40%{opacity:0;transform:translateY(8px)}60%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
header.top{background:linear-gradient(90deg,#0b1f55,#1d4ed8);border:0;border-bottom:4px solid #dc2626}
header.top b,header.top small,header.top .meta{color:#fff}
.ticker{display:flex;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 16px rgba(15,42,107,.15)}
.ticker>b{background:#dc2626;color:#fff;padding:9px 12px;font-size:.82rem;white-space:nowrap}
.mq{overflow:hidden;flex:1;display:flex;align-items:center}
.mq span{white-space:nowrap;padding-left:100%;animation:mq 45s linear infinite;font-weight:600;color:var(--navy);font-size:.92rem}
@keyframes mq{to{transform:translateX(-100%)}}
.lead{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;background:var(--navy);margin-bottom:14px;box-shadow:0 10px 30px rgba(15,42,107,.3)}
.lead img{width:100%;height:100%;object-fit:cover;object-position:top}
.lead .ov{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 14px;background:linear-gradient(transparent,rgba(5,15,50,.94));color:#fff;display:grid;gap:6px}
.lead h2{color:#fff;font-size:1.3rem}.lead .meta{color:#cfe3ff}
.tg{background:#dc2626;color:#fff;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:4px;display:inline-block;width:max-content}
.tg.social{background:#16a34a}.tg.news{background:#1d4ed8}
.card .th{position:relative}.card .th .tg{position:absolute;left:8px;top:8px}
.card h3{font-size:1.05rem}
h2.sec{border-left:5px solid #dc2626;padding-left:10px}
.hl{font-size:1.7rem;margin:10px 0 6px}.byline{margin-bottom:8px}
.sbar{margin:10px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sb{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem}
#modal.sh{place-items:end center;padding:0}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px;width:min(540px,100%);display:grid;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;font-size:.75rem;font-weight:600}
.sgrid a,.sgrid button{display:grid;justify-items:center;gap:4px;color:var(--navy);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
.sgrid .sb{width:52px;height:52px;font-size:1.3rem}

@media(max-width:560px){.hide-m{display:none}}

.hero{padding:0;overflow:hidden;background:linear-gradient(180deg,#bfdbfe,#e0f2fe);gap:0}
.hero .tx{padding:18px 18px 4px;display:grid;gap:6px}
.hero .anim.hs{position:static;display:block;width:100%;height:auto;max-height:none}
.mq span{animation-delay:-14s}
.lead{max-height:460px}
.hero .anim.hs{max-height:300px}

.foot{margin-top:22px}.foot a{color:var(--royal)}

header.top{background:#fff;border-bottom:3px solid #8d4a5b}header.top b{color:var(--navy)}header.top small{color:var(--mut)}
header.top .sup{display:grid;text-decoration:none;line-height:1.2;margin-right:10px}header.top .sup small{font-size:.65rem;font-weight:700;letter-spacing:.06em;color:#8d4a5b}header.top .sup b{font-size:.82rem}
.tb{border:0;border-radius:99px;padding:11px 20px;font:700 .78rem system-ui;letter-spacing:.05em;cursor:pointer;transition:transform .15s}.tb:active{transform:scale(.96)}
.tb.dark{background:#7d3f50;color:#fff}.tb.light{background:#fff;color:#7d3f50}.tb.sm{padding:9px 16px}
.tpl{position:relative;border-radius:18px;overflow:hidden;height:380px;margin-bottom:16px;background:#a56a79;box-shadow:0 10px 30px rgba(15,42,107,.25)}
.tslide{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}.tslide.on{opacity:1;pointer-events:auto}
.tslide>img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;object-position:50% 12%;filter:saturate(.8)}
.tslide.lg>img{object-fit:contain;background:#fff;padding:18px}
.tmask{position:absolute;inset:0;background:linear-gradient(90deg,#a56a79 0%,#a56a79 38%,rgba(165,106,121,.75) 55%,rgba(165,106,121,.1) 80%)}
.ttx{position:absolute;left:0;top:0;bottom:0;width:62%;padding:28px 28px 28px 60px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.ttx h2{color:#e11d2e;font-size:2rem;text-shadow:0 1px 0 rgba(255,255,255,.25)}.ttx p{color:#2b1a20;font-size:.95rem;border-left:3px solid #2b1a20;padding-left:10px;max-width:420px}
.tar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#e11d2e;color:#fff;font-size:1.3rem;cursor:pointer;z-index:3}.tar.l{left:12px}.tar.r{right:12px}
@media(max-width:700px){.tpl{height:420px}.tslide>img{width:100%}.tmask{background:linear-gradient(180deg,rgba(125,63,80,.15) 0%,rgba(125,63,80,.55) 45%,rgba(100,45,62,.94) 100%)}
.ttx{width:100%;top:auto;justify-content:flex-end;padding:20px 54px}.ttx h2{font-size:1.45rem;color:#ffd1d6}.ttx p{color:#fff;border-color:#fff}}
@media(max-width:700px){header.top .hide-m{display:none!important}}

.bg .anim{display:none}body{overflow-x:hidden}
.glass{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1,h2.sec{background:rgba(255,255,255,.88);padding:6px 12px;border-radius:10px}
.glass h1,.glass h2.sec,.lead h2,.ttx h2,.hl{background:none;padding:0;border-radius:0}.glass h2.sec{padding-left:10px}
#topnav{display:none}
@media(min-width:1100px){
 body{padding:0}#tabs,header.top{display:none}
 #app{max-width:1060px}
 #topnav{display:block;position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.1);height:72px}
 .tn{height:72px;max-width:1500px;margin:auto;padding:0 28px;display:flex;align-items:center;position:relative;font-family:system-ui,sans-serif}
 .tn .gb{border:0;background:none;font-size:1.4rem;color:#7d3f50;cursor:pointer;margin-right:10px}
 .tn nav{display:flex}.tn nav>div{position:relative}
 .tn nav a.m{display:block;padding:26px 9px;font-size:11px;font-weight:700;letter-spacing:.05em;color:#2b1a20;cursor:pointer;text-transform:uppercase;white-space:nowrap}
 .tn nav a.m:hover,.tn nav a.m.on{color:#e11d2e}
 .tn .dm{display:none;position:absolute;top:72px;left:0;background:#fff;min-width:190px;box-shadow:0 10px 24px rgba(0,0,0,.15);border-top:3px solid #e11d2e}
 .tn nav>div:hover .dm{display:block}.tn .dm a{display:block;padding:10px 16px;font-size:12px;font-weight:600;color:#2b1a20;cursor:pointer}.tn .dm a:hover{background:#fdecee;color:#e11d2e}
 .tn .logobox{position:absolute;left:50%;top:0;transform:translateX(-50%);width:210px;height:100px;background:#fff;display:grid;place-content:center;justify-items:center;gap:4px;box-shadow:0 8px 16px rgba(0,0,0,.14);cursor:pointer;z-index:5}
 .tn .logobox img{width:58px;height:58px;border-radius:50%}.tn .logobox b{font-size:10px;letter-spacing:.14em;color:var(--navy)}
 .tn .tr{margin-left:auto;display:flex;align-items:center;gap:16px}
 .tn .sup2{display:flex;gap:8px;align-items:center;text-decoration:none;color:#2b1a20}.tn .sup2 span{font-size:1.5rem;color:#7d3f50}.tn .sup2 small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;color:#7d3f50}.tn .sup2 b{font-size:12px}
 .tn .srch{border:0;background:none;font-size:1.3rem;cursor:pointer;color:#7d3f50}
 .tpl{width:100vw;margin-left:calc(50% - 50vw);border-radius:0;height:440px;margin-top:-16px}
 .tslide>img{width:52%}.ttx{width:56%;padding-left:12vw}.ttx h2{font-size:2.7rem;max-width:520px}
 .tmask{background:linear-gradient(90deg,#a56a79 0%,#a56a79 40%,rgba(165,106,121,.78) 58%,rgba(165,106,121,.08) 82%)}
 .tar.l{left:20px}.tar.r{right:20px}
}
</style>

<script>/* BELDARI SAMAJ SEWA – frontend app. Data layer = Store (localStorage). Swap Store.load/save for API calls later. */
const $ = (s, r = document) => r.querySelector(s);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NAME = 'BELDARI SAMAJ SEWA';
const A = (window.A = {});

/* ---------- toast / modal ---------- */
function toast(m, t = '') { const d = document.createElement('div'); d.className = 'toast ' + t; d.textContent = m; $('#toasts').append(d); setTimeout(() => d.remove(), 3200); }
A.open = src => { const m = $('#modal'); m.className = ''; m.innerHTML = `<button class="btn x">✕ Close</button><img src="${e(src)}" alt="">`; m.hidden = false; m.onclick = () => (m.hidden = true); };

/* ---------- store ---------- */
const Store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('bss_' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bss_' + k, JSON.stringify(v)); return true; } catch { toast('Device storage is full. Use smaller or fewer files.', 'err'); return false; } }
};
const C = { posts: [], events: [], members: [], notes: [], photos: [], albums: [] };
const R = { on: false };
const save = k => { const ok = Store.set(k, C[k]); sync(k); return ok || R.on; };
const S = { key: sessionStorage.getItem('bss_key') || '', admin: sessionStorage.getItem('bss_admin') === '1', q: '', cat: '', cm: 0, after: null, pend: {} };
async function api(path, opt = {}) { const r = await fetch('/api' + path, { ...opt, headers: { ...(opt.headers || {}), 'x-admin-key': S.key } }); if (!r.ok) throw new Error(r.status); return r; }
async function sync(k) { if (!R.on || !S.admin) return; try { await api('/data/' + k, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(C[k]) }); } catch (err) { toast(err.message === '401' ? 'Server rejected the admin key. Log out and log in again with your current password.' : 'Could not save to the server (' + err.message + '). Saved on this device only.', 'err'); } }
async function upImg(dataUrl) { const blob = await (await fetch(dataUrl)).blob(); const r = await api('/img', { method: 'PUT', headers: { 'content-type': 'image/jpeg' }, body: blob }); return (await r.json()).url; }

async function load() {
  for (const k of Object.keys(C)) C[k] = Store.get(k, []);
  let seed = SEED; try { seed = await (await fetch('posts.json', { cache: 'no-cache' })).json(); } catch (err) { }
  let remotePosts = false;
  await Promise.all(Object.keys(C).map(async k => { try { const r = await fetch('/api/data/' + k, { cache: 'no-store' }); if (!r.ok || !/json/.test(r.headers.get('content-type') || '')) return; const j = await r.json(); R.on = true; if (Array.isArray(j.items)) { C[k] = j.items; if (k === 'posts') remotePosts = true; Store.set(k, j.items); } } catch (err) { } }));
  if (!remotePosts) { const hidden = Store.get('hidden', []); for (const s of seed) if (!C.posts.some(p => p.id === s.id) && !hidden.includes(s.id)) C.posts.push(s); }
  fetch('hero.mp4', { method: 'HEAD' }).then(r => { if (r.ok && /video/.test(r.headers.get('content-type') || '')) { const v = $('#bgv'); v.src = 'hero.mp4'; v.play().catch(() => {}); } }).catch(() => {});
}

const NAV = [['home', '🏠', 'Home'], ['political', '🏛️', 'Political Updates'], ['social', '🤝', 'Social Service'], ['gallery', '🖼️', 'Photo Gallery'], ['videos', '🎬', 'Video Gallery'], ['news', '🔔', 'News & Notices'], ['events', '📅', 'Events'], ['members', '👥', 'Members'], ['search', '🔍', 'Search'], ['about', 'ℹ️', 'About Us'], ['contact', '✉️', 'Contact'], ['profile', '👤', 'Profile'], ['settings', '⚙️', 'Settings'], ['privacy', '🔒', 'Privacy'], ['admin', '🛠️', 'Admin']];
A.go = p => { location.hash = '#/' + p; };
const pub = () => C.posts.filter(p => p.status !== 'draft').sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')));
const ofType = t => pub().filter(p => p.type === t);
const empty = (i, t, s = '') => `<div class="glass empty"><b>${i}</b><p><strong>${t}</strong></p><p>${s}</p></div>`;
const thumb = p => p.images?.[0] ? `<img src="${e(p.images[0])}" alt="" loading="lazy">` : p.videos?.[0] ? `<video src="${e(p.videos[0])}#t=0.5" preload="metadata" muted></video>` : '📰';
const card = p => `<article class="glass card" tabindex="0" onclick="A.go('post/${p.id}')" onkeydown="if(event.key==='Enter')A.go('post/${p.id}')"><div class="th">${thumb(p)}<span class="tg ${p.type}">${e(p.cat || p.type)}</span></div><div class="bd"><h3>${e(p.title)}</h3><p>${e(p.desc)}</p><div class="row" style="justify-content:space-between"><span class="meta">✍ ${e(p.author || NAME)} · 🕒 ${e(p.date)}${p.time ? ' ' + e(p.time) : ''}</span><button class="btn sm sec" onclick="event.stopPropagation();A.sheet('${p.id}')">⤴ Share</button></div></div></article>`;
const leadHTML = p => `<article class="lead" tabindex="0" onclick="A.go('post/${p.id}')"><div style="position:absolute;inset:0">${thumb(p)}</div><div class="ov"><span class="tg ${p.type}">${e(p.cat || p.type)}</span><h2>${e(p.title)}</h2><span class="meta">✍ ${e(p.author || NAME)} · 🕒 ${e(p.date)}${p.time ? ' ' + e(p.time) : ''}</span></div></article>`;
function ticker() { const it = [...C.notes.slice(0, 4).map(n => n.title), ...pub().slice(0, 5).map(p => p.title)]; const t = it.length ? it.join('   ◆   ') : NAME + ' — सेवा • सहयोग • समर्पण'; return `<div class="ticker"><b>🔴 ताजा खबर</b><div class="mq"><span>${e(t)}</span></div></div>`; }
const sec = (t, link, body) => `<h2 class="sec">${t}${link ? `<a onclick="A.go('${link}')">View all</a>` : ''}</h2>${body}`;
const cards = (l, em) => l.length ? `<div class="grid">${l.map(card).join('')}</div>` : em;
const albumsAll = () => ['Social service', 'Political', 'Village events', ...C.albums.map(a => a.name)];
const allPhotos = () => [...C.posts.filter(p => p.status !== 'draft').flatMap(p => (p.images || []).map(src => ({ src, album: p.type === 'political' ? 'Political' : p.type === 'social' ? 'Social service' : 'Village events', caption: p.title, post: p.id, date: p.date }))), ...C.photos.map(p => ({ ...p, own: 1 }))];
const allVideos = () => [...C.posts.filter(p => p.status !== 'draft').flatMap(p => (p.videos || []).map(src => ({ src, type: p.type, title: p.title, date: p.date, post: p.id })))];
async function sha(s) { if (!crypto.subtle) return 'x' + btoa(unescape(encodeURIComponent(s))); const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function cred() { let c = Store.get('cred'); if (!c) { c = { u: 'admin', h: await sha('admin@beldari'), a: await sha('beldari') }; Store.set('cred', c); } return c; }

window.S_q = v => { S.q = v; clearTimeout(S.t); S.t = setTimeout(() => render(true), 300); };
const kinds = ['Emergency', 'Meeting', 'Event', 'Public information'];
const noteRow = n => `<div class="glass item" onclick="A.read('${n.id}')" style="cursor:pointer">${readIds().includes(n.id) ? '' : '<span class="dot" title="Unread"></span>'}<div class="grow"><span class="badge ${n.kind === 'Emergency' ? 'emergency' : ''}">${e(n.kind)}</span> <b>${e(n.title)}</b><span class="meta">${e(n.date)}</span><p style="white-space:normal">${e(n.msg)}</p></div></div>`;
A.read = id => { const r = readIds(); if (!r.includes(id)) { r.push(id); Store.set('read', r); render(true); } };
A.readAll = () => { Store.set('read', C.notes.map(n => n.id)); render(true); };
V.news = () => `<div class="row" style="justify-content:space-between"><h1>News & Notices</h1>${unread() ? '<button class="btn sm sec" onclick="A.readAll()">Mark all read</button>' : ''}</div><p class="meta" style="margin:6px 0 12px">Announcements, emergency notices, meetings and public information. Full history is kept below.</p>
  ${C.notes.length ? `<div class="list">${C.notes.map(noteRow).join('')}</div>` : empty('🔔', 'No notifications yet', 'Village notices will show here.')}${ofType('news').length ? sec('Village news', '', cards(ofType('news'), '')) : ''}`;
const upcoming = () => C.events.filter(x => x.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
const evRow = x => `<div class="glass item">${x.image ? `<img class="av" style="border-radius:12px" src="${e(x.image)}" alt="">` : '<div class="av" style="border-radius:12px">📅</div>'}<div class="grow"><b>${e(x.title)}</b><span class="meta">${e(x.date)} · ${e(x.time || '')} · 📍 ${e(x.loc || '')}</span><p style="white-space:normal;font-size:.88rem">${e(x.desc || '')}</p></div></div>`;
V.events = () => {
  const d = new Date(); d.setMonth(d.getMonth() + S.cm, 1); const y = d.getFullYear(), m = d.getMonth(), n = new Date(y, m + 1, 0).getDate();
  const has = day => C.events.some(x => x.date === `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`);
  const past = C.events.filter(x => x.date < today()).sort((a, b) => b.date.localeCompare(a.date));
  return `<h1>Events & Programs</h1><div class="glass" style="margin:10px 0"><div class="row" style="justify-content:space-between;padding:10px 14px"><button class="btn sm sec" onclick="S.cm--;render(true)">‹</button><b>${d.toLocaleString('en', { month: 'long', year: 'numeric' })}</b><button class="btn sm sec" onclick="S.cm++;render(true)">›</button></div>
  <div class="cal">${'SMTWTFS'.split('').map(x => `<span class="hd">${x}</span>`).join('')}${'<span></span>'.repeat(new Date(y, m, 1).getDay())}${Array.from({ length: n }, (_, i) => `<span class="${has(i + 1) ? 'ev' : ''}">${i + 1}</span>`).join('')}</div></div>
  ${sec('Upcoming', '', upcoming().length ? `<div class="list">${upcoming().map(evRow).join('')}</div>` : empty('📅', 'No upcoming events'))}${sec('Previous events', '', past.length ? `<div class="list">${past.map(evRow).join('')}</div>` : empty('🗓️', 'No previous events'))}`;
};
V.members = () => {
  const q = S.q.toLowerCase(); const l = C.members.filter(m => !q || (m.name + m.role).toLowerCase().includes(q));
  return `<h1>Community Members</h1><input style="margin:10px 0" placeholder="Search by name or designation…" value="${e(S.q)}" oninput="S_q(this.value)">${l.length ? `<div class="list">${l.map(m => `<div class="glass item">${m.photo ? `<img class="av" src="${e(m.photo)}" alt="">` : `<div class="av">${e((m.name || '?')[0])}</div>`}<div class="grow"><b>${e(m.name)}</b><span class="meta">${e(m.role)}</span>${m.phone ? `<a href="tel:${e(m.phone)}">📞 ${e(m.phone)}</a>` : ''}</div></div>`).join('')}</div>` : empty('👥', 'No members found', 'Admins can add members from the admin panel.')}`;
};
V.search = () => {
  const q = S.q.toLowerCase(); const r = q ? [...pub().filter(p => (p.title + p.desc).toLowerCase().includes(q)), ] : [];
  return `<h1>Search</h1><input style="margin:10px 0" autofocus placeholder="Search posts, events, members, notices…" value="${e(S.q)}" oninput="S_q(this.value)">${!q ? empty('🔍', 'Type to search') : ''}
  ${q ? sec('Posts', '', cards(r, empty('🔎', 'No posts match'))) : ''}${q ? sec('Events', '', `<div class="list">${C.events.filter(x => (x.title + x.desc).toLowerCase().includes(q)).map(evRow).join('') || empty('📅', 'No events match')}</div>`) : ''}
  ${q ? sec('Members', '', `<div class="list">${C.members.filter(x => (x.name + x.role).toLowerCase().includes(q)).map(m => `<div class="glass item"><div class="av">${e(m.name[0])}</div><div class="grow"><b>${e(m.name)}</b><span class="meta">${e(m.role)}</span></div></div>`).join('') || empty('👥', 'No members match')}</div>`) : ''}`;
};

V.profile = () => { const p = Store.get('profile', {}); return `<div class="glass pad"><h1>My Profile</h1><form onsubmit="A.prof(event)"><label>Name<input name="n" value="${e(p.n)}"></label><label>Phone<input name="p" value="${e(p.p)}"></label><label>Ward / address<input name="w" value="${e(p.w)}"></label><button class="btn">Save profile</button></form></div>`; };
A.prof = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); Store.set('profile', f); toast('Profile saved'); };
V.settings = () => `<div class="glass pad"><h1>Settings</h1><form><label>Text size<select onchange="A.ts(this.value)">${['16', '18', '20'].map(s => `<option ${Store.get('ts', '16') === s ? 'selected' : ''}>${s}</option>`)}</select></label><label><span><input type="checkbox" style="width:auto" ${Store.get('nt', true) ? 'checked' : ''} onchange="Store_s('nt',this.checked)"> Show notification badges</span></label><button type="button" class="btn red" onclick="A.reset()">Clear all data on this device</button></form></div>`;

V.privacy = () => `<div class="glass pad"><h1>Privacy & Information</h1><p>This version stores content only on your own device (browser storage). Nothing is sent to any server. When online storage is added, this page will describe what is collected and why.</p><p style="margin-top:8px">Posts show the views of those who publish them. ${NAME} does not endorse any party.</p></div>`;

const postF = () => [{ k: 'type', l: 'Section', t: 'select', o: ['political', 'social', 'news'] }, { k: 'title', l: 'Post title', r: 1 }, { k: 'author', l: 'Written by (author name)', d: 'me', r: 1 }, { k: 'cat', l: 'Category', list: ['News', 'Announcement', 'Event', 'Public question', 'Road conditions', 'Charity', 'Food & clothes', 'Medical help', 'Education', 'Cleaning', 'Tree plantation', 'Development'] }, { k: 'desc', l: 'Description', t: 'textarea', r: 1 }, { k: 'date', l: 'Date', t: 'date', d: 'today' }, { k: 'time', l: 'Time', t: 'time', d: 'now' }, { k: 'loc', l: 'Location' }, { k: 'images', l: 'Photos', t: 'img', m: 1 }, { k: 'videos', l: 'Videos', t: 'vid', m: 1 }, { k: 'docs', l: 'Documents', t: 'doc', m: 1 }];

function formHTML(fields, v) {
  return fields.map(f => {
    const val = e(v[f.k] ?? (f.d === 'today' ? today() : f.d === 'now' ? new Date().toTimeString().slice(0, 5) : f.d === 'me' ? Store.get('author', '') : ''));
    if (f.t === 'textarea') return `<label>${f.l}<textarea name="${f.k}" rows="6" ${f.r ? 'required' : ''}>${val}</textarea></label>`;
    if (f.t === 'select') return `<label>${f.l}<select name="${f.k}">${f.o.map(o => `<option ${o == v[f.k] ? 'selected' : ''}>${e(o)}</option>`).join('')}</select></label>`;
    if (['img', 'vid', 'doc'].includes(f.t)) return `<label>${f.l}<input type="file" name="${f.k}" data-k="${f.k}" data-t="${f.t}" data-m="${f.m ? 1 : ''}" accept="${f.t === 'img' ? 'image/*' : f.t === 'vid' ? 'video/*' : '.pdf,.doc,.docx,.xls,.xlsx,.txt'}" ${f.m ? 'multiple' : ''}></label><div class="prev" id="pv-${f.k}"></div>`;
    return `<label>${f.l}<input type="${f.t || 'text'}" name="${f.k}" value="${val}" ${f.list ? `list="dl-${f.k}"` : ''} ${f.r ? 'required' : ''}></label>${f.list ? `<datalist id="dl-${f.k}">${f.list.map(o => `<option>${o}</option>`).join('')}</datalist>` : ''}`;
  }).join('');
}
const shrink = file => new Promise(res => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => { const k = Math.min(1, 1280 / Math.max(i.width, i.height)); const c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82)); }; i.onerror = () => res(null); i.src = r.result; }; r.readAsDataURL(file); });
function showPrev(k, t, vals) { const box = $('#pv-' + k); if (!box) return; box.innerHTML = (vals || []).map(s => t === 'img' ? `<img src="${e(s)}" alt="">` : t === 'vid' ? `<video src="${e(s)}" muted controls></video>` : `<span class="badge">📎 ${e(s)}</span>`).join(''); }
function formView(tab, id) {
  const cfg = CFG[tab]; const item = id === 'new' ? {} : C[tab].find(x => x.id === id) || {}; S.pend = {};
  S.after = () => {
    cfg.f().filter(f => ['img', 'vid', 'doc'].includes(f.t)).forEach(f => { const cur = item[f.k]; showPrev(f.k, f.t, cur ? [].concat(cur) : []); });
    $('#f').querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
      const t = inp.dataset.t, k = inp.dataset.k, files = [...inp.files]; let out = [];
      if (t === 'img') { showPrev(k, 'doc', ['Uploading…']); out = []; for (const f of files) { const d = await shrink(f); if (!d) continue; if (R.on) { try { out.push(await upImg(d)); continue; } catch (err) { toast('Server upload failed. Saved on this device only.', 'err'); } } out.push(d); } } else if (t === 'vid') out = files.map(f => URL.createObjectURL(f)); else out = files.map(f => f.name);
      if (t === 'vid' && files.length) toast('Video preview works for this session. Permanent video storage needs the online server.');
      S.pend[k] = inp.dataset.m ? out : out[0]; showPrev(k, t, out);
    });
    $('#f').onsubmit = ev => {

      cfg.f().filter(f => ['img', 'vid', 'doc'].includes(f.t)).forEach(f => { d[f.k] = S.pend[f.k] !== undefined ? S.pend[f.k] : item[f.k] ?? (f.m ? [] : ''); });
      if (tab === 'photos') { const l = [].concat(d.src || []); if (!l.length) return toast('Choose at least one photo', 'err'); if (item.id) C.photos = C.photos.filter(x => x.id !== item.id); l.forEach(s => C.photos.unshift({ id: uid(), album: d.album, caption: d.caption, src: s, date: today() })); }
      else { const rec = { ...item, ...d, id: item.id || uid() }; if (tab === 'posts') { rec.status = st; Store.set('author', rec.author); } const i = C[tab].findIndex(x => x.id === rec.id); i < 0 ? C[tab].unshift(rec) : (C[tab][i] = rec); if (tab === 'notes') toast('Notification sent to all users on this device'); }
      if (!save(tab)) return; toast(tab === 'posts' ? (st === 'draft' ? 'Draft saved' : 'Published') : 'Saved'); A.go('admin/' + tab);
    };
  };
  return `<div class="glass pad"><h1>${id === 'new' ? 'New' : 'Edit'} ${cfg.s}</h1><form id="f" style="margin-top:12px">${formHTML(cfg.f(), item)}<div class="row">${tab === 'posts' ? '<button class="btn" data-st="published">Publish</button><button class="btn sec" data-st="draft">Save draft</button>' : '<button class="btn" data-st="x">Save</button>'}<button type="button" class="btn sec" onclick="history.back()">Cancel</button></div></form></div>`;
}

A.login = async ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const c = await cred(); if (f.u === c.u && (await sha(f.p)) === c.h) { S.admin = true; S.key = await sha(f.p); sessionStorage.setItem('bss_admin', '1'); sessionStorage.setItem('bss_key', S.key); toast('Welcome, admin'); A.go('admin/overview'); } else toast('Wrong username or password', 'err'); };
A.logout = () => { S.admin = false; S.key = ''; sessionStorage.removeItem('bss_admin'); sessionStorage.removeItem('bss_key'); A.go('home'); };
A.forgot = async ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const c = await cred(); if ((await sha(f.a.trim().toLowerCase())) !== c.a) return toast('Recovery answer is incorrect', 'err'); c.h = await sha(f.p); Store.set('cred', c); alert('Your username is: ' + c.u + '\nYour password has been reset.'); A.go('admin'); };
function accountView() { return `<div class="glass pad"><h2>Change username or password</h2><form onsubmit="A.acct(event)" style="margin-top:10px"><label>Current password<input name="cp" type="password" required></label><label>New username (leave empty to keep)<input name="u"></label><label>New password (leave empty to keep)<input name="p" type="password" minlength="6"></label><label>New recovery answer (leave empty to keep)<input name="a"></label><button class="btn">Save changes</button></form></div>`; }
A.acct = async ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); const c = await cred(); if ((await sha(f.cp)) !== c.h) return toast('Current password is wrong', 'err'); if (f.u) c.u = f.u.trim(); if (f.p) c.h = await sha(f.p); if (f.a) c.a = await sha(f.a.trim().toLowerCase()); Store.set('cred', c); if (f.p && R.on) { try { await api('/key', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: c.h }) }); S.key = c.h; sessionStorage.setItem('bss_key', c.h); } catch (err) { toast('Password changed here, but the server key was not updated.', 'err'); } } ev.target.reset(); toast('Account updated'); };

const TOP = [['HOME', 'home'], ['POLITICAL', 'political'], ['SERVICE', 'social'], ['GALLERY', [['Photo Gallery', 'gallery'], ['Video Gallery', 'videos']]], ['NEWS', [['News & Notices', 'news'], ['Events', 'events'], ['Search', 'search']]], ['PAGES', [['Members', 'members'], ['About Us', 'about'], ['Contact', 'contact'], ['Profile', 'profile'], ['Settings', 'settings'], ['Privacy', 'privacy'], ['Admin', 'admin']]]];
